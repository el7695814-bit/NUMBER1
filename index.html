<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>האתר שלי</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f9fc;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #0366d6;
            color: white;
            text-align: center;
            padding: 2.5rem 1rem;
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }
        header p {
            margin-top: 0.5rem;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
        }
        .card h2 {
            margin-top: 0;
            color: #0366d6;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #e1e4e8;
            font-size: 0.9rem;
            color: #586069;
        }
    </style>
</head>
<body>

    <header>
        <h1>ברוכים הבאים לאתר שלי</h1>
        <p>אתר זה נבנה ומתארח ב-GitHub Pages</p>
    </header>

    <main>
        <section class="card">
            <h2>אודות</h2>
            <p>כאן תוכל לכתוב תיאור קצר עליך, על הפרויקט או על המטרה של האתר.</p>
        </section>

        <section class="card">
            <h2>קישורים ועדכונים</h2>
            <p>אפשר להוסיף רשימת קישורים, פרויקטים נוספים או כל תוכן שתרצה להציג.</p>
        </section>
    </main>

    <footer>
        <p>© 2026 כל הזכויות שמורות</p>
    </footer>

</body>
</html>
